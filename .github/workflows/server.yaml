name: 'server'

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-musl'
          - platform: 'ubuntu-22.04-arm'
            target: 'aarch64-unknown-linux-musl'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: build
        run: cargo build --release --package Server --target ${{ matrix.target }}

      - name: test
        run: cargo test --package Server

      - name: strip and prepare binary (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          strip target/${{ matrix.target }}/release/server
          mkdir -p dist
          cp target/${{ matrix.target }}/release/server dist/server-${{ matrix.target }}

      - name: prepare binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\server.exe dist\server-${{ matrix.target }}.exe

      - uses: actions/upload-artifact@v5
        with:
          name: server-${{ matrix.target }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: get version
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v5

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: server-v${{ steps.version.outputs.version }}
          name: 'Server v${{ steps.version.outputs.version }}'
          draft: true
          files: server-*/server-*
