[package]
name = "Server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints.rust]
unsafe_code = "deny"

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
sea-orm = { version = "2", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-json", "with-chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4"] }
argon2 = "0.5"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
getrandom = "0.2"
sha2 = "0.11.0"
hex = "0.4.3"
base64 = "0.22"
redis = { version = "1", features = ["tokio-comp"] }
regex = "1"
toml = "0.9"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["fs", "limit", "trace"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
alpaca_sdk = { git = "https://github.com/ZZHENJIE/TradeSDK", package = "alpaca_sdk" }
finviz_sdk = { git = "https://github.com/ZZHENJIE/TradeSDK", package = "finviz_sdk" }
benzinga_sdk = { git = "https://github.com/ZZHENJIE/TradeSDK", package = "benzinga_sdk" }
plotters = { version = "0.3", default-features = false, features = ["chrono", "bitmap_backend", "candlestick"] }
image = { version = "0.25", default-features = false, features = ["png"] }
